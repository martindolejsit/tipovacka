<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
  <title>E-mailové připomínky | Tipovačka</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f6f8; color: #37323f; }
    main { box-sizing: border-box; width: min(540px, calc(100% - 32px)); margin: 32px 0; padding: 32px; background: white; border: 1px solid #dedbe5; border-radius: 20px; }
    .brand { font-size: 13px; letter-spacing: .08em; font-weight: 750; text-transform: uppercase; }
    h1 { font-size: clamp(24px, 6vw, 30px); line-height: 1.2; margin: 16px 0; }
    p { line-height: 1.6; }
    button { border: 0; border-radius: 12px; padding: 14px 20px; background: #b2ff00; color: #111; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: default; }
    button:focus-visible, a:focus-visible { outline: 3px solid #6c36da; outline-offset: 4px; }
    a { color: inherit; }
    #status { min-height: 1.6em; }
    .note { font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      body { background: #19171e; color: #efedf4; }
      main { background: #24212b; border-color: #47414f; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Tipovačka</div>
    <h1>Vypnout e-mailové připomínky?</h1>
    <p>Po potvrzení přestaneme posílat připomínky chybějících tipů. Svůj účet ani uložené tipy tím nezměníš.</p>
    <button id="confirm" type="button" disabled>Vypnout připomínky</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note">Již odeslaný e-mail může ještě dorazit. Upozornění můžeš znovu zapnout v profilu.</p>
    <a href="/profile">Přejít do profilu</a>
  </main>
  <script>
    'use strict';
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get('token') || '';
    const project = params.get('project') || '';
    // Token není v query, serverovém access logu ani referreru. Po načtení odstraníme i fragment.
    history.replaceState(null, '', location.pathname);
    const button = document.getElementById('confirm');
    const status = document.getElementById('status');
    const valid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)
      && /^[a-z0-9-]+\.supabase\.co$/.test(project) && project.length <= 90;
    if (!valid) {
      status.textContent = 'Odkaz není úplný. Otevři jej znovu z e-mailu, nebo vypni připomínky v profilu.';
    } else {
      button.disabled = false;
      button.addEventListener('click', async () => {
        button.disabled = true;
        status.textContent = 'Vypínám připomínky…';
        try {
          const response = await fetch('https://' + project + '/functions/v1/tip-reminders?action=unsubscribe', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token }), credentials: 'omit', referrerPolicy: 'no-referrer',
            signal: AbortSignal.timeout(15000),
          });
          const result = await response.json();
          if (response.status === 410) {
            status.textContent = 'Tento odkaz již neplatí. Použij nejnovější e-mail nebo nastavení v profilu.';
            return;
          }
          if (!response.ok || result.success !== true) throw new Error('Request failed');
          document.querySelector('h1').textContent = 'Připomínky jsou vypnuté';
          button.textContent = 'Hotovo';
          status.textContent = 'Další připomínky chybějících tipů už nebudeme odesílat.';
        } catch {
          status.textContent = 'Výsledek se nepodařilo ověřit. Zkus to znovu nebo vypni připomínky v profilu.';
          button.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
